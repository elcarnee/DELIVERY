<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Comercios - Delivery Comodoro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        /* Toggle switch styles (moved from inline script) */
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--vero-lime);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        /* Header padding override (base.css uses different padding) */
        .header {
            padding: 1.5rem 2rem;
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(30, 41, 59, 0.6);
            padding: 0.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab {
            flex: 1;
            padding: 1rem;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--gray);
        }

        .tab.active {
            background: rgba(163, 230, 53, 0.1);
            color: var(--vero-lime);
            border-color: var(--vero-lime);
        }

        .orders-grid {
            display: grid;
            gap: 1.5rem;
        }

        .order-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            color: #F8FAFC;
        }

        .order-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .order-card.pending {
            border-left-color: var(--accent);
        }

        .order-card.preparing {
            border-left-color: #3B82F6;
        }

        .order-card.ready {
            border-left-color: var(--success);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1.5rem;
        }

        .order-number {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .order-time {
            color: var(--gray);
            font-size: 0.875rem;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .status-pending {
            background: #FEF3C7;
            color: #92400E;
        }

        .status-preparing {
            background: #DBEAFE;
            color: #1E40AF;
        }

        .status-ready {
            background: #D1FAE5;
            color: #065F46;
        }

        .order-items {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }

        .item-name {
            font-weight: 600;
        }

        .item-quantity {
            color: var(--gray);
            margin-right: 1rem;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin: 1rem 0;
        }

        .info-item {
            display: flex;
            align-items: start;
            gap: 0.5rem;
        }

        .info-label {
            color: var(--gray);
            font-size: 0.875rem;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .total-label {
            font-weight: 600;
            color: var(--gray);
        }

        .total-amount {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--vero-lime);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
        }

        .btn-ready {
            background: #3B82F6;
            color: white;
        }

        .empty-state {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .stats-bar {
                width: 100%;
                justify-content: space-around;
                gap: 0.5rem;
                padding: 1rem;
            }

            .tabs {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .tab {
                flex: 1 1 calc(50% - 0.5rem);
                /* 2 columns on mobile */
                font-size: 0.9rem;
                padding: 0.75rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                padding: 1.25rem;
                font-size: 1.1rem;
            }

            .order-card {
                padding: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Saltar al contenido</a>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                VERO<span style="color: var(--vero-lime);">.</span> <span
                    style="font-weight: 400; font-size: 1.2rem; margin-left: 5px; color: var(--gray);">Comercios</span>
            </div>
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="pendingCount">0</div>
                    <div class="stat-label">Pendientes</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="todayCount">0</div>
                    <div class="stat-label">Hoy</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalAmount">$0</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </div>
    </header>

    <main class="container" id="main-content" role="main">
        <nav class="tabs" role="navigation" aria-label="Filtros de pedidos">
            <button class="tab active" onclick="filterOrders('pending')">
                ⏳ Pendientes
            </button>
            <button class="tab" onclick="filterOrders('preparing')">
                👨‍🍳 Preparando
            </button>
            <button class="tab" onclick="filterOrders('ready')">
                ✅ Listos
            </button>
            <button class="tab" onclick="filterOrders('all')">
                📋 Todos
            </button>
            <button class="tab" onclick="openProfileTab()">
                👤 Mi Perfil
            </button>
        </nav>

        <div id="ordersContainer">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- PROFILE CONTAINER (Initially Hidden) -->
        <div id="profileContainer" style="display:none; animation: fadeIn 0.3s ease;">

            <!-- Header: Centered Restaurant Name -->
            <div
                style="text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1.5rem; margin-bottom: 2rem;">
                <h2 id="profileRestName"
                    style="color:white; font-family:'Poppins',sans-serif; font-size: 2.5rem; margin-bottom: 0.5rem;">
                    Cargando...</h2>
                <div style="color: var(--vero-lime); font-weight: 500; font-size: 1.1rem;">Administración del Local
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:2rem;">

                <!-- Left: Menu Manager -->
                <div>
                    <h3
                        style="color:white; margin-bottom:1.5rem; display: flex; align-items: center; gap: 0.5rem; font-size: 1.25rem;">
                        📋 Gestión de Menú
                    </h3>

                    <!-- Add Product Form -->
                    <form id="addProductForm" onsubmit="addProduct(event)"
                        style="background:rgba(30, 41, 59, 0.6); padding:1.5rem; border-radius:16px; margin-bottom:2rem; border: 1px solid rgba(255,255,255,0.05);">
                        <div
                            style="color:var(--gray); font-size: 0.9rem; margin-bottom:1rem; text-transform:uppercase; letter-spacing:1px; font-weight:600;">
                            Agregar Nuevo Producto</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                            <input type="text" id="newProdName" placeholder="Nombre (ej: Pizza)" required
                                style="width:100%; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                            <div style="display:flex; gap:0.5rem;">
                                <input type="number" id="newProdPrice" placeholder="$ Precio" required
                                    style="flex:1; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem;">
                            <input type="text" id="newProdDesc" placeholder="Descripción breve (opcional)"
                                style="width:100%; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:1rem;">
                                <input type="text" id="newProdOptions" placeholder="Opt: Carne, Pollo (sep por coma)"
                                    style="padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                                <input type="number" id="newProdLimit" placeholder="Max (ej: 12)" value="1" min="1"
                                    title="Máximo de opciones a elegir"
                                    style="padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                            </div>
                            <input type="text" id="newProdImg" placeholder="URL de Imagen (opcional - https://...)"
                                style="width:100%; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <select id="newProdCat" required
                                style="width:100%; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                                <option value="Pizzas">Pizzas</option>
                                <option value="Empanadas">Empanadas</option>
                                <option value="Parrilla">Parrilla</option>
                                <option value="Sushi">Sushi</option>
                                <option value="Helados">Helados</option>
                                <option value="Bebidas">Bebidas</option>
                                <option value="Postres">Postres</option>
                                <option value="Otros">Otros</option>
                            </select>
                            <div style="display:flex; gap:10px;">
                                <button type="submit" id="btnSaveProduct"
                                    style="width:100%; padding:0.75rem; background:var(--vero-lime); color:var(--vero-dark); font-weight:700; border:none; border-radius:8px; cursor:pointer; transition:all 0.3s; font-size:1rem;">
                                    + Agregar Item
                                </button>
                                <button type="button" id="btnCancelEdit" onclick="cancelEdit()"
                                    style="display:none; width:30%; padding:0.75rem; background:rgba(255,255,255,0.1); color:white; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Product List -->
                    <div id="loadingMenu" style="display:none; color:var(--gray); text-align:center;">Cargando menú...
                    </div>
                    <div id="menuList" style="display:grid; gap:0.75rem;">
                        <!-- JS renders items here -->
                    </div>
                </div>

                <!-- Right: Information & Danger Zone -->
                <div
                    style="border-left:1px solid rgba(255,255,255,0.1); padding-left:2rem; display: flex; flex-direction: column; gap: 3rem;">
                    <div>
                        <h3 style="color:white; margin-bottom:1.5rem; font-size: 1.25rem;">🏪 Gestión del Local</h3>
                        <div
                            style="background:rgba(30, 41, 59, 0.6); padding:1.5rem; border-radius:16px; border: 1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; gap:1.5rem;">

                            <!-- Status Toggle -->
                            <div>
                                <div style="color:var(--gray); font-size:0.9rem; margin-bottom:0.75rem;">Estado de
                                    Recepción</div>
                                <div style="display:flex; align-items:center; justify-content:space-between;">
                                    <div id="statusLabel"
                                        style="color:var(--success); font-weight:600; font-size:1.1rem; display:flex; align-items:center; gap:0.5rem;">
                                        <span
                                            style="display:block; width:10px; height:10px; background:var(--success); border-radius:50%; box-shadow: 0 0 10px var(--success);"></span>
                                        Abierto
                                    </div>
                                    <label class="switch"
                                        style="position:relative; display:inline-block; width:60px; height:34px;">
                                        <input type="checkbox" id="storeToggle" onchange="toggleStoreStatus(this)">
                                        <span class="slider round"
                                            style="position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#ccc; transition:.4s; border-radius:34px;"></span>
                                    </label>
                                </div>
                            </div>

                            <!-- Cover Image Input -->
                            <div>
                                <div style="color:var(--gray); font-size:0.9rem; margin-bottom:0.75rem;">URL Portada /
                                    Logo</div>
                                <div style="display:flex; gap:0.5rem;">
                                    <input type="text" id="storeImage" placeholder="https://..."
                                        style="flex:1; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                                    <button onclick="updateStoreImage()"
                                        style="padding:0.75rem; background:var(--vero-card); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px; cursor:pointer;"
                                        aria-label="Actualizar imagen de portada">
                                        📷
                                    </button>
                                </div>
                            </div>

                            <!-- Address Input -->
                            <div>
                                <div style="color:var(--gray); font-size:0.9rem; margin-bottom:0.75rem;">Dirección del
                                    Local</div>
                                <div style="display:flex; gap:0.5rem;">
                                    <input type="text" id="storeAddress" placeholder="Ej: San Martín 123"
                                        style="flex:1; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                                    <button onclick="updateAddress()"
                                        style="padding:0.75rem; background:var(--vero-card); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px; cursor:pointer;"
                                        aria-label="Actualizar direccion">
                                        📍
                                    </button>
                                </div>
                            </div>

                            <!-- Schedule Input -->
                            <div>
                                <div style="color:var(--gray); font-size:0.9rem; margin-bottom:0.75rem;">Horarios de
                                    Atención</div>
                                <div style="display:flex; gap:0.5rem;">
                                    <input type="text" id="storeSchedule" placeholder="Ej: 19:00 - 23:30"
                                        style="flex:1; padding:0.75rem; background:rgba(15, 23, 42, 0.6); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:8px;">
                                    <button onclick="updateSchedule()"
                                        style="padding:0.75rem; background:var(--vero-lime); color:var(--vero-dark); border:none; border-radius:8px; font-weight:700; cursor:pointer;"
                                        aria-label="Guardar horarios">
                                        💾
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div>
                        <h3 style="color:var(--danger); margin-bottom:1.5rem; font-size: 1.25rem;">Zona de Peligro</h3>
                        <div style="display:flex; flex-direction:column; gap:1rem;">
                            <button onclick="handleLogout()"
                                style="padding:1rem; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:white; border-radius:12px; cursor:pointer; text-align:left; transition: all 0.2s hover; display:flex; align-items:center; gap:0.75rem;">
                                <span style="font-size:1.2rem;">👋</span> Cerrar Sesión
                            </button>
                            <button onclick="deleteCommerceAccount()"
                                style="padding:1rem; background:rgba(239,68,68,0.1); border:1px solid var(--danger); color:var(--danger); border-radius:12px; cursor:pointer; text-align:left; transition: all 0.2s hover; display:flex; align-items:center; gap:0.75rem;">
                                <span style="font-size:1.2rem;">🗑️</span> Eliminar Cuenta
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts: Supabase CDN first, then config, then modal, then auth, then role-specific -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/vero-modal.js"></script>
    <script src="js/auth-manager.js"></script>
    <script src="js/commerce.js"></script>
</body>

</html>
