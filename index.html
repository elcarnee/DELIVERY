<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0EA5E9">
    <title>Delivery Comodoro - Pedí lo que quieras</title>

    <!-- Fuentes distintivas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        /* Consumer-specific overrides (base styles in css/base.css) */
        body {
            color: #F1F5F9;
            overflow-x: hidden;
        }

        .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            gap: 1rem;
            animation: slideInLeft 0.6s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .logo-icon:hover {
            transform: rotate(-5deg) scale(1.05);
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
        }

        .location-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cart-button {
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            animation: slideInRight 0.6s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-button:hover {
            background: white;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .cart-count {
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* Search Section */
        .search-section {
            max-width: 1400px;
            margin: -30px auto 0;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .search-card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .search-input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--gray);
        }

        .search-input {
            width: 100%;
            padding: 1.25rem 1.5rem 1.25rem 4.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 1.125rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.6);
            color: white;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 2px rgba(163, 230, 53, 0.2);
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 0.5rem;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-pill {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out calc(0.3s + var(--delay)) both;
        }

        .category-pill:hover {
            color: white;
            transform: translateY(-2px);
        }

        .category-pill.active {
            background: rgba(163, 230, 53, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 1.5rem 6rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #F8FAFC;
        }

        /* Restaurants Grid */
        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .restaurant-card {
            background: #1E293B;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeInUp 0.6s ease-out calc(0.4s + var(--delay)) both;
        }

        .restaurant-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.4);
            border-color: var(--primary);
        }

        .restaurant-image-wrapper {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .restaurant-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .restaurant-card:hover .restaurant-image {
            transform: scale(1.1);
        }

        .restaurant-badges {
            position: absolute;
            top: 1rem;
            left: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            background: white;
            color: var(--dark);
            padding: 0.375rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .badge-popular {
            background: var(--accent);
            color: white;
        }

        .badge-new {
            background: var(--success);
            color: white;
        }

        .restaurant-rating {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--dark);
            color: white;
            padding: 0.5rem 0.875rem;
            border-radius: 50px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            box-shadow: var(--shadow);
        }

        .restaurant-info {
            padding: 1.5rem;
        }

        .restaurant-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #F8FAFC;
        }

        .restaurant-category {
            color: var(--gray);
            font-size: 0.9375rem;
            margin-bottom: 1rem;
        }

        .restaurant-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--gray);
            font-size: 0.875rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-weight: 500;
        }

        /* Consumer Modal Overrides */
        .modal-overlay {
            z-index: 2001;
            /* Above bottom-nav (1000) */
            padding: 2rem;
        }

        .modal {
            background: #1E293B;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--light);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            position: relative;
            height: 300px;
            background: linear-gradient(135deg, var(--vero-dark) 0%, #1e293b 100%);
            border-radius: 32px 32px 0 0;
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 48px;
            height: 48px;
            background: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            transform: rotate(90deg) scale(1.1);
            background: var(--danger);
            color: white;
        }

        .modal-body {
            padding: 2rem;
        }

        .menu-section {
            margin-bottom: 2.5rem;
        }

        .menu-section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: white;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(8px);
        }

        .menu-item-info {
            flex: 1;
        }

        .menu-item-name {
            font-weight: 700;
            font-size: 1.125rem;
            margin-bottom: 0.375rem;
        }

        .menu-item-description {
            color: var(--gray);
            font-size: 0.9375rem;
            margin-bottom: 0.75rem;
        }

        .menu-item-price {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.375rem;
            color: var(--primary);
        }

        .add-button {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 0.875rem 1.75rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .add-button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        /* Mobile Bottom Nav */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.5rem;
            z-index: 1000;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom, 0.75rem);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--gray);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.5rem;
        }

        /* Consumer Loading Override */
        .loading {
            padding: 4rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--light);
            border-top-color: var(--primary);
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
            }

            .header {
                padding: 0;
            }

            .header-content {
                padding: 0.75rem 1rem;
            }

            .logo-text {
                font-size: 1.25rem;
            }

            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
                border-radius: 12px;
            }

            .location-badge {
                display: none;
                /* Hide location in header on mobile to save space */
            }

            .cart-button {
                padding: 0.5rem 0.75rem;
                font-size: 0.875rem;
            }

            .cart-button {
                /* Floating Action Button style above nav */
                position: fixed;
                bottom: calc(70px + env(safe-area-inset-bottom));
                right: 1.5rem;
                border-radius: 50px;
                padding: 0.75rem 1.5rem;
                box-shadow: var(--shadow-xl);
                z-index: 999;
                background: var(--primary);
                color: var(--dark);
                border: none;
            }

            .cart-button:hover {
                transform: scale(1.05);
                background: var(--primary-dark);
            }

            .main-content {
                padding-bottom: 7rem;
                /* Space for bottom nav */
                margin-top: 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .restaurants-grid {
                grid-template-columns: 1fr;
                /* 1 Column */
                gap: 1.5rem;
            }

            .restaurant-image-wrapper {
                height: 180px;
            }

            /* Bottom Sheet Modal */
            .modal {
                position: fixed;
                bottom: 0;
                top: auto;
                left: 0;
                width: 100%;
                max-width: 100%;
                border-radius: 24px 24px 0 0;
                max-height: 85vh;
                transform: translateY(100%);
                animation: slideUpMobile 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            @keyframes slideUpMobile {
                from {
                    transform: translateY(100%);
                }

                to {
                    transform: translateY(0);
                }
            }

            .modal-header {
                height: 200px;
            }

            .modal-close {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                font-size: 1.25rem;
            }

            .modal {
                border-radius: 24px 24px 0 0;
                max-height: 95vh;
            }
        }

        /* Tracking Stepper */
        .tracking-stepper {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin: 1.5rem 0;
        }
        .tracking-step {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            position: relative;
            padding-bottom: 1.5rem;
        }
        .tracking-step:last-child {
            padding-bottom: 0;
        }
        .tracking-step::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 40px;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.1);
        }
        .tracking-step:last-child::before {
            display: none;
        }
        .tracking-step.completed::before {
            background: var(--primary);
        }
        .step-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .tracking-step.completed .step-icon {
            background: rgba(163, 230, 53, 0.15);
            border-color: var(--primary);
        }
        .tracking-step.active .step-icon {
            background: var(--primary);
            border-color: var(--primary);
            animation: pulse-icon 2s ease-in-out infinite;
        }
        @keyframes pulse-icon {
            0%, 100% { box-shadow: 0 0 0 0 rgba(163, 230, 53, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(163, 230, 53, 0); }
        }
        .step-info {
            padding-top: 0.4rem;
        }
        .step-label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.95rem;
        }
        .tracking-step.completed .step-label,
        .tracking-step.active .step-label {
            color: #F8FAFC;
        }
        .step-time {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 2px;
        }
        .tracking-meta {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .tracking-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }
        .tracking-meta-row:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tracking-meta-label {
            color: var(--gray);
            font-size: 0.85rem;
        }
        .tracking-meta-value {
            color: #F8FAFC;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Cart FAB */
        .cart-fab {
            display: none;
            /* Hidden on Desktop */
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom));
            /* Above bottom nav */
            right: 1.5rem;
            background: var(--primary);
            color: var(--dark);
            border: none;
            border-radius: 50px;
            padding: 1rem 1.5rem;
            font-weight: 700;
            box-shadow: var(--shadow-xl);
            z-index: 2000;
            cursor: pointer;
            align-items: center;
            gap: 0.5rem;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .cart-fab {
                display: flex;
                /* Show on Mobile */
            }

            /* Hide Desktop Cart Button inside Header */
            .header .cart-button-desktop {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Saltar al contenido</a>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div>
                <div class="logo">
                    <span class="logo-text" style="font-size: 1.5rem;">VERO<span
                            style="color: var(--vero-lime);">.</span> <span
                            style="font-weight: 400; font-size: 1.4rem; margin-left: 5px; color: var(--gray);">Delivery</span></span>
                </div>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <div id="authButtons">
                    <!-- JS Swaps this button -->
                    <button class="cart-button" onclick="window.location.href='auth.html'"
                        style="background: transparent; border-color: rgba(255,255,255,0.2); color: white; white-space: nowrap;"
                        aria-label="Ingresar a tu cuenta">
                        👤 Ingresar
                    </button>
                    <!-- LOGGED IN STATE (Hidden by default) -->
                    <button id="profileBtn" class="cart-button" onclick="openProfileModal()"
                        style="display:none; background: rgba(163, 230, 53, 0.2); color: var(--vero-lime); border: 1px solid var(--vero-lime); white-space: nowrap;"
                        aria-label="Abrir perfil">
                        👤 Perfil
                    </button>
                </div>
                <button class="cart-button cart-button-desktop" onclick="toggleCart()" aria-label="Abrir carrito de compras">
                    <span>🛒</span>
                    <span>Carrito</span>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
        <div class="search-card">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput"
                    placeholder="Buscar restaurantes, pizzas, empanadas..." oninput="filterRestaurants()"
                    aria-label="Buscar restaurantes">
            </div>
            <div class="categories" id="categories" role="navigation" aria-label="Categorias de comida">
                <div class="category-pill active" style="--delay: 0s" onclick="filterCategory('all', this)">
                    🍽️ Todos
                </div>
                <div class="category-pill" style="--delay: 0.05s" onclick="filterCategory('Pizza', this)">
                    🍕 Pizzas
                </div>
                <div class="category-pill" style="--delay: 0.1s" onclick="filterCategory('Empanadas', this)">
                    🥟 Empanadas
                </div>
                <div class="category-pill" style="--delay: 0.15s" onclick="filterCategory('Parrilla', this)">
                    🥩 Parrilla
                </div>
                <div class="category-pill" style="--delay: 0.2s" onclick="filterCategory('Sushi', this)">
                    🍣 Sushi
                </div>
                <div class="category-pill" style="--delay: 0.25s" onclick="filterCategory('Heladería', this)">
                    🍦 Helados
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content" id="main-content" role="main">
        <div class="section-header">
            <h2 class="section-title">Restaurantes Disponibles</h2>
        </div>

        <div id="restaurantsContainer">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Restaurant Modal -->
    <div class="modal-overlay" id="restaurantModal" role="dialog" aria-modal="true" aria-label="Detalle del restaurante">
        <div class="modal">
            <div class="modal-header">
                <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">✕</button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal-overlay" id="cartModal" role="dialog" aria-modal="true" aria-label="Carrito de compras">
        <div class="modal">
            <div class="modal-header" style="height: 100px; background: var(--primary);">
                <h2
                    style="color: white; margin: 0; position: absolute; bottom: 1.5rem; left: 2rem; font-family: 'Poppins', sans-serif;">
                    Tu Pedido</h2>
                <button class="modal-close" onclick="toggleCart()" aria-label="Cerrar carrito">✕</button>
            </div>
            <div class="modal-body">
                <div id="cartItemsContainer">
                    <!-- Cart items loaded here -->
                </div>

                <div id="cartTotalSection"
                    style="margin-top: 2rem; border-top: 1px solid var(--light); padding-top: 1.5rem;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <span style="font-size: 1.25rem; font-weight: 700;">Total</span>
                        <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary);"
                            id="cartTotal">$0</span>
                    </div>

                    <div id="checkoutForm" style="display: none;">
                        <h3 style="margin-bottom: 1rem;">Datos de envío</h3>
                        <div style="display: grid; gap: 1rem; margin-bottom: 1.5rem;">
                            <input type="text" id="customerName" placeholder="Tu Nombre" class="search-input"
                                style="padding: 1rem;">
                            <input type="tel" id="customerPhone" placeholder="Tu Teléfono" class="search-input"
                                style="padding: 1rem;">
                            <input type="text" id="customerAddress" placeholder="Dirección de entrega"
                                class="search-input" style="padding: 1rem;">
                            <select id="paymentMethod" class="search-input" style="padding: 1rem;">
                                <option value="efectivo">Efectivo</option>
                                <option value="transferencia">Transferencia</option>
                                <option value="tarjeta">Tarjeta (MP)</option>
                            </select>
                            <textarea id="orderNotes" placeholder="Notas (opcional, ej: sin cebolla)"
                                class="search-input" style="padding: 1rem; height: auto;" rows="3"></textarea>
                        </div>
                    </div>

                    <button id="checkoutButton" class="add-button"
                        style="width: 100%; font-size: 1.125rem; padding: 1rem;" onclick="proceedToCheckout()">
                        Continuar
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal" style="z-index: 200;" role="dialog" aria-modal="true" aria-label="Mi perfil">
        <div class="modal" style="max-width: 800px;">
            <div class="modal-header"
                style="background: var(--card-bg); border-bottom: 1px solid rgba(255,255,255,0.1);">
                <h2 style="color: white; font-family: 'Poppins', sans-serif;">Mi Perfil</h2>
                <button class="modal-close" onclick="closeProfileModal()" aria-label="Cerrar perfil">✕</button>
            </div>
            <div class="modal-body">

                <!-- Tabs -->
                <div
                    style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <button class="profile-tab active" onclick="switchProfileTab('data')"
                        style="padding: 1rem; background:none; border:none; color:white; font-weight:600; cursor:pointer; border-bottom: 2px solid var(--primary);">Mis
                        Datos</button>
                    <button class="profile-tab" onclick="switchProfileTab('history')"
                        style="padding: 1rem; background:none; border:none; color:var(--gray); font-weight:600; cursor:pointer;">Historial
                        de Pedidos</button>
                </div>

                <!-- Tab: My Data -->
                <div id="tab-data">
                    <div style="display: grid; gap: 1.5rem;">
                        <div>
                            <label style="color:var(--gray); display:block; margin-bottom:0.5rem;">Nombre
                                Completo</label>
                            <input type="text" id="profileName" class="search-input" style="padding: 1rem;">
                        </div>
                        <div>
                            <label style="color:var(--gray); display:block; margin-bottom:0.5rem;">Teléfono</label>
                            <input type="tel" id="profilePhone" class="search-input" style="padding: 1rem;">
                        </div>
                        <div>
                            <label style="color:var(--gray); display:block; margin-bottom:0.5rem;">Dirección
                                Guardada</label>
                            <input type="text" id="profileAddress" class="search-input" style="padding: 1rem;">
                        </div>
                        <button onclick="saveProfile()" class="add-button"
                            style="padding: 1rem; width: auto; align-self: start;">
                            💾 Guardar Cambios
                        </button>

                        <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2rem;">
                            <button onclick="handleLogout()"
                                style="background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 1rem; border-radius: 12px; cursor: pointer; width: 100%;">
                                👋 Cerrar Sesión
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tab: History -->
                <div id="tab-history" style="display: none;">
                    <div id="historyList" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- JS loads orders here -->
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!-- Flavor Selection Modal -->
    <div class="modal-overlay" id="flavorModal" onclick="if(event.target === this) closeFlavorModal()" role="dialog" aria-modal="true" aria-label="Seleccion de opciones">
        <div class="modal" style="max-width: 400px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
                <h2 class="section-title" style="margin-bottom: 0;">Elige una opción</h2>
                <button onclick="closeFlavorModal()"
                    style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;" aria-label="Cerrar">&times;</button>
            </div>

            <div id="flavorList" style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1.5rem;">
                <!-- Options rendered here -->
            </div>

            <button onclick="confirmFlavor()" class="btn-primary" style="width:100%;">
                Confirmar y Agregar
            </button>
        </div>
    </div>

    <!-- Tracking Modal -->
    <div class="modal-overlay" id="trackingModal" style="z-index: 300;" role="dialog" aria-modal="true" aria-label="Seguimiento del pedido">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header" style="background: linear-gradient(135deg, #a3e635 0%, #84cc16 100%);">
                <h2 style="color: #0F172A; margin: 0; position: absolute; bottom: 1.5rem; left: 2rem; font-family: 'Poppins', sans-serif;">
                    Seguimiento</h2>
                <button class="modal-close" onclick="closeTracking()" style="color: #0F172A;" aria-label="Cerrar seguimiento">✕</button>
            </div>
            <div class="modal-body" id="trackingContent">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div class="modal-overlay" id="ratingModal" style="z-index: 400;" onclick="if(event.target===this) closeRatingModal()" role="dialog" aria-modal="true" aria-label="Calificar pedido">
        <div class="modal" style="max-width: 420px;">
            <div style="padding: 2rem; text-align: center;">
                <h2 id="ratingTitle" style="font-family: 'Poppins', sans-serif; margin-bottom: 1.5rem; color: white;">Calificar</h2>
                <div id="ratingStars" style="display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem;">
                    <!-- Stars rendered by JS -->
                </div>
                <textarea id="ratingComment" placeholder="Comentario opcional..." rows="3"
                    style="width: 100%; padding: 1rem; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; font-family: inherit; resize: none; margin-bottom: 1.5rem;"></textarea>
                <div style="display: flex; gap: 1rem;">
                    <button onclick="closeRatingModal()" style="flex: 1; padding: 1rem; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">Cancelar</button>
                    <button id="btnSubmitRating" onclick="submitRating()" style="flex: 1; padding: 1rem; background: var(--primary); color: var(--dark); border: none; border-radius: 12px; cursor: pointer; font-weight: 700;">Enviar Calificacion</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        style="position: fixed; bottom: 20px; right: 20px; background: var(--success); color: var(--vero-dark); padding: 1rem 2rem; border-radius: 12px; font-weight: 700; transform: translateY(100px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);"
        role="status" aria-live="polite">
        Producto Agregado 🛒
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" role="navigation" aria-label="Navegacion principal">
        <a href="#" class="nav-item active" onclick="switchNav('home')">
            <span class="nav-icon">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="#search" class="nav-item"
            onclick="switchNav('search'); document.querySelector('.search-input').focus()">
            <span class="nav-icon">🔍</span>
            <span>Buscar</span>
        </a>
        <a href="#" class="nav-item" onclick="openProfileModal()">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </a>
    </nav>

    <!-- Mobile Cart FAB -->
    <button id="mobileCartBtn" class="cart-fab" onclick="toggleCart()" aria-label="Abrir carrito de compras">
        <span>🛒</span>
        <span class="cart-count" id="cartCountMobile">0</span>
    </button>

    <!-- Scripts: Supabase CDN first, then config, then modal, then auth, then role-specific -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/vero-modal.js"></script>
    <script src="js/auth-manager.js"></script>
    <script src="js/consumer.js"></script>
</body>

</html>
